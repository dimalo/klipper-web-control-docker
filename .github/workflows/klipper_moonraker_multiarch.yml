name: Klipper Moonraker Multiarch Image CI

on:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "42 13 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Read upstream.lock
        id: lock
        run: |
          # shellcheck disable=SC1091
          set -a
          # strip comments / blank lines then source KEY=value lines
          eval "$(grep -E '^[A-Z0-9_]+=' upstream.lock)"
          set +a
          echo "klipper_ref=${KLIPPER_REF}" >> "$GITHUB_OUTPUT"
          echo "moonraker_ref=${MOONRAKER_REF}" >> "$GITHUB_OUTPUT"
          echo "z_calibration_ref=${Z_CALIBRATION_REF}" >> "$GITHUB_OUTPUT"

      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/klipper-moonraker
          DATE=${{ steps.date.outputs.date }}
          BRANCH=${GITHUB_REF##*/}

          # If this is git tag, use the tag name as a docker tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          if [[ $BRANCH == develop ]]; then
            # If the BRANCH is 'develop', assume that
            # this is the next version of the image and also
            # tag with DATE.
            BASE_TAG=next
            TAGS="${DOCKER_IMAGE}:${BASE_TAG},${DOCKER_IMAGE}:${DATE}-dev"
          else
            # If the VERSION looks like a version number, assume that
            # this is the latest version of the image and also
            # tag it with the VERSION, else use DATE.
            BASE_TAG=latest
            if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              TAGS="${DOCKER_IMAGE}:${BASE_TAG},${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${DATE}"
            else
              TAGS="${DOCKER_IMAGE}:${BASE_TAG},${DOCKER_IMAGE}:${DATE}"
            fi
          fi

          {
            echo "tags=${TAGS}"
            echo "docker_image=${DOCKER_IMAGE}"
            echo "base_tag=${BASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./klipper/Dockerfile
          # python:3.11-*-bookworm has no arm/v6 (amd64, arm64, arm/v7, 386, ppc64le).
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            KLIPPER_REF=${{ steps.lock.outputs.klipper_ref }}
            MOONRAKER_REF=${{ steps.lock.outputs.moonraker_ref }}
            Z_CALIBRATION_REF=${{ steps.lock.outputs.z_calibration_ref }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.docker_image }}:${{ steps.prep.outputs.base_tag }}
          cache-to: type=inline
