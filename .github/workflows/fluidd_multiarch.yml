name: Fluidd Multiarch Image CI

on:
  push:
    branches:
      - main
    tags:
      # Hub version tags: accept both 2.0.0 and v2.0.0 (git release chaos).
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: "42 13 * * 0,2,5"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Hub semver tag to publish (e.g. 2.0.0). Leave empty for latest+date only."
        required: false
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Read upstream.lock
        id: lock
        run: |
          eval "$(grep -E '^[A-Z0-9_]+=' upstream.lock)"
          echo "fluidd_zip_url=${FLUIDD_ZIP_URL}" >> "$GITHUB_OUTPUT"

      - name: Prepare
        id: prep
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/fluidd
          VERSION=latest
          DATE=${{ steps.date.outputs.date }}

          # Git tag push: strip optional leading "v" (handles 2.0.0 and v2.0.0).
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          elif [[ -n "${DISPATCH_VERSION:-}" ]]; then
            VERSION=${DISPATCH_VERSION#v}
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${DATE}"

          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest"
          fi

          {
            echo "tags=${TAGS}"
            echo "docker_image=${DOCKER_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            FRONTEND_ZIP_URL=${{ steps.lock.outputs.fluidd_zip_url }}
