# CI-only config: no real printer / MCU.
# Klipper may log serial errors; processes must stay up.
# Do NOT assert klippy "ready" in CI smoke.

[include client.cfg]
[include client_macros.cfg]

# Dummy MCU path — device does not exist on CI runners.
# If this prevents process stay-up, prefer omitting [mcu] and keep kinematics: none only.
[mcu]
serial: /dev/serial/by-id/ci-does-not-exist

[printer]
kinematics: none
max_velocity: 100
max_accel: 1000
