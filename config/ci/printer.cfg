# CI config: Linux host MCU (klipper_mcu) — no printer hardware.
# Primary MCU is the in-container host process at /tmp/klipper_host_mcu
# (same serial path as config/host_mcu.cfg). kinematics: none → no axes.

[include client.cfg]
[include client_macros.cfg]

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 100
max_accel: 1000
