; CI override: run Linux MCU without realtime (-r).
; GitHub Actions / many Docker hosts reject sched_setscheduler even with
; SYS_NICE; without -r the process stays up and creates /tmp/klipper_host_mcu.
[program:klipper_mcu]
user=root
command=/usr/local/bin/klipper_mcu
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes = 0
autorestart=true
autostart=false
dependent_startup=true
priority=10
