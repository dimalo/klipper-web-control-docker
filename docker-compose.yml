# Default stack: no host serial devices (CI / Portainer / dry config validate).
# For a real printer MCU, also merge docker-compose.hw.yml:
#   docker compose -f docker-compose.yml -f docker-compose.hw.yml up -d
# See docs/hardware/mcu-serial.md

services:
  klipper:
    image: dimalo/klipper-moonraker
    build:
      dockerfile: ./klipper/Dockerfile
      context: .
    # Runtime group_add for serial permissions lives in docker-compose.hw.yml
    # (or set GIDs there / in your stack). See docs/hardware/mcu-serial.md
    cap_add:
      - SYS_NICE
    container_name: klipper
    ports:
      - 7125:7125
    restart: unless-stopped
    volumes:      
      - gcode_files:/home/klippy/printer_data/gcodes
      # be aware to create your own branch if you mount the config folder as it will be updated on the main branch
      # that way you can merge upstream changes to your customized configs
      - ./config:/home/klippy/printer_data/config
      # Moonraker -d printer_data uses printer_data/database (not ~/.moonraker_database)
      - moonraker_data:/home/klippy/printer_data/database
      # - <<your_config_path>>:/home/klippy/printer_data/config
      # - ./printer.cfg:/home/klippy/printer_data/config/printer.cfg

  ##################################################################
  # Example config for a second printer on a different serial port
  # Docs: docs/platforms/multi-printer.md (Fluidd is single-upstream by default)
  ##################################################################

  # klipper_another_printer:
  #   image: dimalo/klipper-moonraker
  #   build:
  #     dockerfile: ./klipper/Dockerfile
  #     context: .
  #     # args:
  #     #   DEVICE_GROUP: device
  #     #   DEVICE_GID: 987
  #   container_name: klipper_another_printer
  #   ports:
  #     # As 7125 is already used by the first printer, we map this moonraker's port to 7126 on the host
  #     - 7126:7125
  #   restart: unless-stopped
  #   volumes:
  #     # Let both klipper instances use the same storage for gcode files
  #     - gcode_files:/home/klippy/printer_data/gcodes
  #     # be aware to create your own branch if you mount the config folder as it will be updated on the main branch
  #     # that way you can merge upstream changes to your (developed) configs...
  #     - ./config_another_printer:/home/klippy/printer_data/config
  #     - moonraker_data_another:/home/klippy/printer_data/database
  #     # - <<your_config_path>>:/home/klippy/printer_data/config
  #     # - ./another_printer.cfg:/home/klippy/printer_data/config/printer.cfg
  #   # map serial in an override or uncomment devices: for the second MCU
  #   devices:
  #     - /dev/ttyACM0:/dev/ttyACM0


  fluidd:
    image: dimalo/fluidd
    # build:
    #   dockerfile: Dockerfile
    #   context: frontend
    restart: unless-stopped
    container_name: fluidd
    ports:
      - 8010:80
    depends_on: 
      - klipper
      # - klipper_another_printer
    links:
      - klipper:klipper
      # - klipper_another_printer:klipper_another_printer

  # mainsail:
  #   image: dimalo/mainsail
  #   build:
  #     dockerfile: Dockerfile
